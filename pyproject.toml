[project]
name = "agentdocket"
version = "0.2.1"
description = "Shared append-only log for coordinating Claude Code sessions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docket = "agentdocket.cli:main"
docket-mcp = "agentdocket.mcp:main"

[tool.setuptools]
packages = ["agentdocket"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
